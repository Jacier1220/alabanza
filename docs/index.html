<title>Hosanna Music</title>
<style>
@font-face{font-family:Firma;src:url(firma.ttf) format('truetype');font-display:swap}
:root{--cyan:#25d1da;--mezcla:linear-gradient(90deg,#1ed760,#25d1da);--top:#1e5a3a;--bg:#0a0b0b;--card:#242424;--card2:#2a2a2a;--green:#1ed760;--cream:#fff;--dim:#b3b3b3;--gold:#ffc864;--pink:#f573a0;--line:#ffffff1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(var(--top),#0d0f0f 300px,#0a0b0b 520px) no-repeat,var(--bg);color:var(--cream);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font-family:inherit;cursor:pointer}


/* arriba: avatar y Música / Prédicas */
.topb{display:flex;align-items:center;gap:8px;padding:14px 16px 4px}
.av{flex:none;width:34px;height:34px;border-radius:17px;border:0;background:linear-gradient(135deg,#1ed760,#25d1da);color:#000;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center}
.pill{flex:none;padding:7px 15px;border-radius:17px;border:0;background:#262727;color:var(--cream);font-size:14px;font-weight:600}
.pill.on{background:var(--mezcla);color:#000}

/* saludo y firma */
.hello{padding:14px 16px 0}
.hello h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.3px}
.marca{color:var(--cyan);font-size:13px;font-weight:700;margin-top:4px}
.firma{display:flex;align-items:center;gap:8px;margin-top:-2px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.firma small{color:var(--dim);font-size:12px}
.firma b{font-family:Firma,cursive;font-weight:normal;font-size:38px;line-height:1.15;color:#fff;padding:0 8px 0 2px}

/* versículo del día */
.verse{margin:14px 16px 4px;padding:15px 18px 16px;border-radius:12px;background:#ffffff1c}
.verse .vt{color:#c8f5d8;font-size:12px;font-weight:800;letter-spacing:.14em}
.verse p{margin:10px 0 8px;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:19px;line-height:1.35}
.verse .vr{font-size:14px;font-weight:700;color:#e6e6e6}

/* cuadritos de colores (accesos rápidos) */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 4px}
.qt{display:flex;align-items:center;height:56px;border-radius:6px;overflow:hidden;border:0;padding:0;color:#fff;text-align:left;font-size:14px;font-weight:700}
.qt i{flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;background:#0002}
.qt span{padding:0 10px;line-height:1.2}

/* secciones */
.sec{font-size:21px;font-weight:800;padding:22px 16px 10px;letter-spacing:-.2px}
.sec2{color:var(--dim);font-size:12px;letter-spacing:.14em;font-weight:700;padding:18px 16px 6px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.cc{flex:none;width:136px;border:0;background:none;color:var(--cream);padding:0;text-align:left}
.cc .im{width:136px;height:136px;border-radius:6px;background:var(--card) center/cover;position:relative;overflow:hidden}
.cc .im em{position:absolute;right:-8px;bottom:-6px;font-style:normal;font-size:56px;transform:rotate(18deg)}
.cc .im b{position:absolute;left:10px;top:10px;right:10px;font-size:16px;line-height:1.2}
.cc .ct{font-size:13px;color:var(--dim);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ar{flex:none;width:104px;border:0;background:none;color:var(--cream);padding:0;text-align:center}
.ar .ci{width:104px;height:104px;border-radius:52px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff}
.ar .ct{font-size:13px;margin-top:7px;line-height:1.25}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.gc{position:relative;height:96px;border-radius:8px;overflow:hidden;border:0;color:#fff;text-align:left;padding:12px;font-size:16px;font-weight:800}
.gc em{position:absolute;right:-6px;bottom:-8px;font-style:normal;font-size:50px;transform:rotate(20deg)}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.tag{padding:8px 14px;border-radius:18px;border:0;background:#ffffff1a;color:var(--cream);font-size:14px;font-weight:600}

/* buscar */
#sbar{display:none;padding:16px 16px 4px}
#sbar h2{margin:0 0 12px;font-size:26px;font-weight:800}
.sbox{display:flex;align-items:center;background:#fff;border-radius:24px;padding:0 6px 0 12px}
.sbox svg{flex:none}
#q{flex:1;min-width:0;border:0;outline:none;background:transparent;color:#121212;font-size:16px;padding:13px 8px;font-weight:600}
#q::placeholder{color:#555;font-weight:500}
#qx{border:0;background:none;color:#333;font-size:20px;padding:6px 8px;display:none}
#sbar .pills{display:flex;gap:8px;margin-top:12px}

/* filas de resultados */
.head{display:flex;align-items:center;gap:10px;padding:14px 12px 4px}
.back{flex:none;width:38px;height:38px;border-radius:19px;border:0;background:#0006;color:var(--cream);font-size:22px;line-height:1}
.htitle{font-size:22px;font-weight:800;line-height:1.2}
.btns{display:flex;gap:10px;align-items:center;padding:10px 16px}
.btn{padding:10px 18px;border-radius:22px;border:1px solid #ffffff55;background:transparent;color:var(--cream);font-weight:700;font-size:14px}
.btn.green{background:var(--mezcla);color:#000;border:0}
.btn.round{width:52px;height:52px;padding:0;border-radius:26px;font-size:20px}
.sh{color:#fff;font-size:18px;font-weight:800;padding:20px 16px 6px}
.row{display:flex;align-items:center;gap:12px;padding:7px 16px}
.row:active{background:#ffffff12}
.row.now .t1{color:var(--green)}
.th{position:relative;flex:none;width:56px;height:56px;border-radius:4px;background:var(--card) center/cover}
.th.wide{width:96px}
.th.round{border-radius:28px}
.badge{position:absolute;right:3px;bottom:3px;font-size:11px;font-weight:700;background:#000c;padding:1px 5px;border-radius:4px}
.tx{min-width:0;flex:1}
.t1{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.more{margin:6px 16px;padding:8px 0;color:var(--dim);font-size:14px;font-weight:700}
.mn{flex:none;width:36px;height:36px;border:0;background:transparent;color:var(--dim);font-size:20px;line-height:1}
.chbtn{border:0;background:#ffffff1f;color:var(--cream);font-size:14px;font-weight:700;padding:8px 14px;border-radius:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbtn span{color:var(--green)}
#msg{text-align:center;color:var(--dim);padding:36px 30px;font-size:15px;line-height:1.5}
.lrow{display:flex;align-items:center;gap:14px;padding:9px 16px;border:0;background:none;color:var(--cream);width:100%;text-align:left}
.lrow i{flex:none;width:56px;height:56px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px}
.lrow b{display:block;font-size:16px;font-weight:600}
.lrow small{color:var(--dim);font-size:13px}

/* barra de abajo y mini reproductor */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;padding:22px 0 calc(6px + env(safe-area-inset-bottom));background:linear-gradient(#00000000,#000000e6 38%,#000)}
.nb{flex:1;border:0;background:none;color:var(--dim);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.nb.on{color:var(--cyan)}
.nb.on svg{color:#fff}
.nb svg{width:25px;height:25px}
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:5;display:none;border-radius:8px;background:#3a3a3a;overflow:hidden;box-shadow:0 6px 20px #0008}
#mini .pl{display:flex;align-items:center;gap:10px;padding:7px 8px}
#cov{width:42px;height:42px;border-radius:4px;background:var(--card) center/cover;flex:none}
#mini .t1{font-size:14px;font-weight:700;-webkit-line-clamp:1}
#mini .t2{font-size:12px;margin-top:0}
.pb{flex:none;width:42px;height:42px;border-radius:21px;border:0;background:transparent;color:var(--cream);font-size:22px}
#mline{height:2px;background:#ffffff40}
#mline div{height:2px;width:0;background:#fff}

/* reproductor grande */
#full{position:fixed;left:0;right:0;top:100%;height:100%;z-index:7;background:#121212;overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom));transition:top .32s ease,visibility .32s;visibility:hidden;overscroll-behavior:contain}
#full.open{top:0;visibility:visible}
#fbg{position:fixed;inset:-40px;background:#333 center/cover;filter:blur(40px) brightness(.42) saturate(1.3);transform:scale(1.2);z-index:-1}
.fhead{display:flex;align-items:center;padding:0 10px}
.fi{flex:none;width:44px;height:44px;border:0;background:none;color:#fff;font-size:24px}
.fq{flex:1;min-width:0;text-align:center;border:0;background:none;color:#fff;padding:0 4px}
.fq small{display:block;font-size:11px;letter-spacing:.06em;color:#ffffffcc}
.fq b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fcov{width:min(86vw,380px);aspect-ratio:1;margin:26px auto 26px;border-radius:8px;background:var(--card) center/cover;box-shadow:0 14px 40px #0009}
.frow{display:flex;align-items:center;gap:12px;padding:0 24px}
.ft{font-size:22px;font-weight:800;line-height:1.25}
#fc{border:0;background:none;color:#ffffffbb;font-size:15px;padding:4px 0 0;text-align:left;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#faddpl{flex:none;width:40px;height:40px;border-radius:20px;border:2px solid #ffffffbb;background:none;color:#fff;font-size:22px;line-height:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#ffffff40;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:7px;background:#fff}
#fprog{width:calc(100% - 48px);margin:20px 24px 0;background:linear-gradient(#fff,#fff) 0/var(--p,0%) 100% no-repeat,#ffffff40}
.ftime{display:flex;justify-content:space-between;color:#ffffffaa;font-size:12px;padding:6px 24px 0}
.fbtns{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 6px}
.fbtns .pb{font-size:28px;width:50px;height:50px;display:flex;align-items:center;justify-content:center}
.pb svg{display:block}
#mini .pb{display:flex;align-items:center;justify-content:center;font-size:24px}
#fshuf,#frep{font-size:24px!important}
.fbig{font-size:32px!important}
.fbig{width:70px!important;height:70px!important;border-radius:35px!important;background:#fff!important;color:#000!important;font-size:28px!important}
#fshuf:not(.on),#frep:not(.on){opacity:.5}
.pb.on{color:var(--green)}
.fbot{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 0}
.fbot button{border:0;background:none;color:#fff;font-size:15px;font-weight:600;padding:8px 4px}

/* hoja de opciones */
#sheet{position:fixed;inset:0;z-index:9;background:#000a;display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet .box{width:100%;background:#242424;border-radius:16px 16px 0 0;padding:10px 0 calc(12px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
.grip{width:40px;height:5px;border-radius:3px;background:#6a6a6a;margin:0 auto 12px}
.shd{display:flex;align-items:center;gap:12px;padding:0 18px 12px;border-bottom:1px solid #3a3a3a}
.shd .th{width:48px;height:48px}
.shd b{display:block;font-size:16px;line-height:1.25}
.shd small{color:var(--dim);font-size:13px}
#sheet .op{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;background:transparent;color:var(--cream);font-size:16px;padding:14px 20px}
#sheet .op i{flex:none;width:26px;text-align:center;font-style:normal;font-size:19px}
#sheet .op:active{background:#ffffff14}
.qh{padding:0 20px 8px}
.qh h3{margin:0;font-size:21px}
.qh small{color:var(--dim);font-size:14px}
.qh button{display:block;border:0;background:none;color:var(--green);font-size:14px;font-weight:700;padding:8px 0 0}

#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:11;background:#fff;color:#000;font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;display:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px #0008}

/* modo propietario */
#own{position:fixed;inset:0;z-index:8;background:#121212;overflow-y:auto;display:none;padding:env(safe-area-inset-top) 0 calc(40px + env(safe-area-inset-bottom))}
#own.open{display:block}
.oin{display:block;width:calc(100% - 40px);margin:0 20px;padding:14px;border-radius:8px;border:0;background:#2a2a2a;color:#fff;font-size:20px;text-align:center;outline:none;letter-spacing:.06em}
.ores{margin:20px 20px 0;padding:18px 16px;border-radius:12px;background:linear-gradient(135deg,#1e5a3a,#242424);text-align:center}
.ores small{color:var(--dim);font-size:14px}
.ores b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:40px;color:var(--green);letter-spacing:.06em;margin:4px 0;user-select:all;-webkit-user-select:all}
.ores .warn{color:#ff6e5a;font-size:13px;margin-top:6px}
.note{color:var(--dim);font-size:13px;line-height:1.45;padding:18px 20px 0}
.big{margin:14px 16px 0;padding:20px;border-radius:10px;background:linear-gradient(135deg,#1db954,#0d73ec)}
.big b{display:block;font-size:46px;line-height:1.1}
.prow{display:flex;align-items:center;gap:12px;padding:12px 18px;border:0;background:none;color:var(--cream);width:100%;text-align:left}
.prow:active{background:#ffffff12}
.prow .ic{flex:none;width:36px;text-align:center;font-size:24px}
.prow b{display:block;font-size:16px;font-weight:600}
.prow small{display:block;color:var(--dim);font-size:13px;white-space:pre-line}
.prow.off .ic{opacity:.4}
.prow.off small{color:#ff6e5a}
#lock{position:fixed;inset:0;z-index:13;background:linear-gradient(#5a1e1e,#121212 45%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#lock .logo{width:84px;height:84px;border-radius:42px;background:#555;color:#000;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center}
#lock p{color:#ff9a8a;font-size:16px;line-height:1.5}
#gate .nm{letter-spacing:0;font-size:17px;margin-bottom:10px}

/* clave del servidor */
#gate{position:fixed;inset:0;z-index:12;background:linear-gradient(var(--top),#0a0b0b 45%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#gate .logo{width:84px;height:84px;border-radius:42px;background:linear-gradient(135deg,#1ed760,#25d1da);color:#000;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center}
#gate h1{margin:14px 0 0;font-size:30px}
#gate .pr{color:var(--gold);font-weight:700;font-size:15px}
#gate p{color:var(--dim);font-size:15px;line-height:1.45;margin:14px 0 18px}
#gate input{width:100%;max-width:340px;padding:14px;border-radius:8px;border:0;background:#2a2a2a;color:#fff;font-size:20px;text-align:center;letter-spacing:.2em;outline:none}
#gate .btn{width:100%;max-width:340px;margin-top:12px;padding:15px;font-size:17px}
</style>
</head>
<body>

<div id="sbar">
  <h2>Buscar</h2>
  <div class="sbox">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="q" type="search" placeholder="¿Qué quieres escuchar?" enterkeyhint="search" autocomplete="off">

  <div class="pills"><button class="pill" data-go="mode:musica">🎵 Música</button><button class="pill" data-go="mode:pred">🎤 Prédicas</button><button class="pill" data-go="paste">🔗 Pegar enlace</button></div>
</div>
<div id="view"></div>
<div id="msg"></div>

<div id="mini">
  <div class="pl">
    <div id="cov"></div>
    <div class="tx"><div class="t1" id="nt"></div><div class="t2" id="nc"></div></div>
    <button class="pb" id="bplay"></button><button class="pb" id="bnext"></button>
  </div>
  <div id="mline"><div></div></div>
</div>
<nav id="nav">
  <button class="nb on" data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 7.5V21h-6.5v-6.5h-5V21H3V10.5z"/></svg>Inicio</button>
  <button class="nb" data-tab="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>Encontrar</button>

</div>
<audio id="au" preload="auto"></audio>
<div id="sheet"><div class="box" id="sbox"></div></div>
<div id="toast"></div>

<div id="gate">

<div id="own"></div>
<div id="lock">

  <p>El propietario desactivó Hosanna Music en este iPhone.<br>Si crees que es un error, pídele que la vuelva a activar.</p>

<script>
const TOPIC = 'alabanza-yhepau56t8hn93x2';
const CHIPS = [['Alabanza','alabanzas cristianas alegres','🙌'],['Adoración','adoración cristiana','🕊'],['Himnos','himnos cristianos antiguos','📜'],

// carátula grande y nítida, como en la app (hq720 sin el «sqp» que la achica; fotos de canal a 800)
function nitida(th){
  if (!th) return th;
  const base = th.split('?')[0], m = base.match(/ytimg\.com\/vi(?:_webp)?\/([\w-]{11})\//);
  if (m) return /maxresdefault\.jpg$/.test(base) ? base : 'https://i.ytimg.com/vi/' + m[1] + '/hq720.jpg';
  if (/googleusercontent\.com|ggpht\.com/.test(th)) return th.replace(/=w\d+-h\d+[^/?]*$/, '=w800-h800-l90-rj').replace(/=s\d+[^/?]*$/, '=s800');
  return th;
}
function bgi(th){
  if (!th) return 'none';
  const hd = nitida(th);
  return hd && hd !== th ? `url('${esc(hd)}'),url('${esc(th)}')` : `url('${esc(th)}')`;
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function time(s){ s = Math.floor(s||0); if (s<=0) return ''; const h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=String(s%60).padStart(2,'0'); return h ? h+':'+String(m).padStart(2,'0')+':'+x : m+':'+x; }
function msg(t){ $('msg').innerHTML = t ? esc(t).replace(/\n/g,'<br>') : ''; }
function toast(t){ const s = $('toast'); s.textContent = t; s.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => s.style.display = 'none', 2400); }

async function findServer(force){
  if (SRV && !force) return SRV;
  const r = await fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=24h');
  const lines = (await r.text()).trim().split('\n').filter(Boolean);
  for (let i = lines.length - 1; i >= 0; i--) {
    try { const o = JSON.parse(lines[i]); if (o.event === 'message' && /^https:\/\//.test(o.message)) { SRV = o.message.trim(); store.set('srv', SRV); return SRV; } } catch(e) {}
  }
  throw new Error('El servidor de la casa no aparece. ¿Está prendido y con internet?');
}

async function api(path, params){
  const qs = new URLSearchParams({...params, k: KEY}).toString();
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const base = await findServer(attempt > 0);
      const r = await fetch(base + path + '?' + qs);
      if (r.status === 403) { gate(); throw new Error('Clave equivocada'); }
      if (!r.ok) throw new Error('El servidor respondió ' + r.status);
      return await r.json();
    } catch (e) { if (attempt === 1 || e.message === 'Clave equivocada') throw e; }
  }
}

    : kind === 'mypl' ? 'Playlist' : list ? 'Lista' : 'Canción';
  const badge = list ? (it.n ? it.n + ' ♪' : '') : time(it.s);
  const now = !list && queue[qi] && queue[qi].u === it.u ? ' now' : '';
  return `<div class="row${now}" data-i="${i}"><div class="th ${cls}" style="background-image:${bgi(it.th)}">${badge ? `<span class="badge">${badge}</span>` : ''}</div>

    const show = b.max ? b.items.slice(0, b.max) : b.items;
    for (const it of show) { h += rowHtml(it, rows.length); rows.push({it, from: b.items}); }
    if (b.max && b.items.length > b.max) { h += `<div class="more" data-more="${blocks.indexOf(b)}">Ver todos (${b.items.length}) ›</div>`; }

// búsquedas guardadas en el iPhone: salen al instante y luego se actualizan
function cacheGet(k){ try { return JSON.parse(store.get('cache', '{}'))[k]; } catch(e) { return null; } }
function cachePut(k, v){
  try {
    const c = JSON.parse(store.get('cache', '{}')); c[k] = v;
    const keys = Object.keys(c); while (keys.length > 40) delete c[keys.shift()];
    try { localStorage.setItem('cache', JSON.stringify(c)); }
    catch (e) { const half = {}; Object.keys(c).slice(-12).forEach(k => half[k] = c[k]); store.set('cache', JSON.stringify(half)); }   // lleno: dejar las últimas
  } catch(e) {}
}
let searchId = 0, curArtist = null, curMix = [], curQ = '';
const n0 = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const COMP = /\bmix\b|megamix|\bhoras?\b|\b1 hora|album completo|disco completo|full album|enganchad|popurri|medley|lo mejor de|recopilacion|concierto completo|en vivo completo|playlist|\blista\b|\bvol(umen)? ?\d|\d+ ?(alabanzas|canciones|himnos|coros|exitos|temas|adoraciones)|musica (para|de) (orar|dormir|estudiar|fondo)|\bsin anuncios\b|\bnon ?stop\b|\bseguidas\b/;
function isSong(it){ return it.s >= 60 && it.s <= 660 && !COMP.test(n0(it.t)); }
function isMix(it){ return it.s >= 1200 || (it.s >= 480 && COMP.test(n0(it.t))); }
function onlyArtist(l, a){
  if (!a || !l) return l || [];
  const k = ' ' + n0(a) + ' ', f = l.filter(x => (' ' + n0(x.c) + ' ').includes(k) || (' ' + n0(x.t) + ' ').includes(k));
  return f.length ? f : l;   // si no hay nada de él, se muestra lo encontrado
}
function addMixes(l){ for (const x of l || []) if (!x.list && isMix(x) && !curMix.some(m => vid(m.u) === vid(x.u))) curMix.push(Object.assign({}, x, {k: 'longmix'})); }

async function search(q, artist, title){

  else { stack = []; window._shead = ''; }
  here = {k: 'search', q, artist: curArtist, title, mode};

  if (mode === 'musica') {

    if (om) addMixes(om.canciones);

    }).catch(()=>{});
  }

    const r = await api('/api/buscar', pred ? {q, pred: 1} : {q});
    if (my !== searchId || v !== viewId) return;
    cachePut(ck, r);
    if (!old || scrollY < 50 && !document.querySelector('.row.now')) showSearch(r);
  } catch (e) { if (my === searchId && v === viewId && !old) msg(e.message); }
}
function showSearch(r){
    msg('');

      if (!songs.length && !(r.listas||[]).length && !(r.canales||[]).length) msg('No encontré prédicas con esa búsqueda.');

            {title:'Álbumes', items: albums, max: 4}, {title:'Listas', items: lists, max: 4}, {title:'Canales', items: r.canales, max: 2}], head);
    if (!songs.length && !albums.length && !lists.length && !mixes.length && !(r.canales||[]).length) msg('No encontré música cristiana con esa búsqueda.');

function vid(u){ const m = /[?&]v=([^&]+)/.exec(u||''); return m ? m[1] : (u||'').split('/').pop(); }

async function openList(it){

    const my = ++viewId, ck = (it.k === 'channel' ? 'c|' : 'l|') + it.u, old = cacheGet(ck);

const noHls = new Set();
function srcFor(base, it){
  const q = 'u=' + encodeURIComponent(it.u) + '&k=' + encodeURIComponent(KEY);
  if (canHls && !noHls.has(it.u)) return base + '/hls.m3u8?' + q;

}
function play(list, i){ queue = list.slice(); played = new Set(); upcomingFor = -1; origin = here; start(i); }

function ago(ms){
  const d = new Date(ms), hoy = new Date(); hoy.setHours(0,0,0,0);
  if (d >= hoy) return 'Hoy';
  if (d >= hoy - 86400000) return 'Ayer';
  if (d >= hoy - 6 * 86400000) return 'Esta semana';
  return 'Antes';
}

  if (o.k === 'list') { const k = o.it.k; return k === 'album' ? 'Ir al álbum' : k === 'channel' ? 'Ir al canal' : k === 'mix' ? 'Ir al mix' : 'Ir a la lista'; }
  if (o.k === 'search') return o.title ? 'Ir a «' + o.title + '»' : 'Ir a la búsqueda «' + o.q + '»';
  if (o.k === 'pl') return 'Ir a la playlist';
  if (o.k === 'hist') return 'Ir al historial';
  return null;
}
function irA(){
  const o = origin; if (!o) return;
  closeFull(); closeSheet();
  if (o.k === 'list') { openList(o.it); return; }
  if (o.k === 'search') {
    if (tab !== 'buscar' && !o.title) { setTab('buscar'); }
    mode = o.mode || mode;
    if (!o.title) $('q').value = o.q;
    search(o.q, o.artist, o.title);
    return;

}

let upcoming = -1, upcomingFor = -1;   // en aleatorio la siguiente se elige antes, para tenerla lista
function nextIndex(){
  if (shuffle && queue.length > 1 && upcomingFor === qi && upcoming >= 0 && upcoming < queue.length && upcoming !== qi) return upcoming;
  return pickNext();
}
function pickNext(){
  if (shuffle && queue.length > 1) {
    let left = queue.map((_, k) => k).filter(k => k !== qi && !played.has(k));
    if (!left.length) { played = new Set([qi]); left = queue.map((_, k) => k).filter(k => k !== qi); }
    return left[Math.floor(Math.random()*left.length)];
  }
  return qi + 1 < queue.length ? qi + 1 : (repeat === 1 && queue.length ? 0 : -1);
}
function next(){ const n = nextIndex(); if (n >= 0) start(n); }
function ended(){ if (repeat === 2) { au.currentTime = 0; au.play().catch(()=>{}); } else next(); }
function prev(){ if (au.currentTime > 5) au.currentTime = 0; else if (qi > 0) start(qi - 1); }

// si se traba: volver a pedir desde el mismo segundo (hasta 3 veces), luego pasar a la siguiente
function resume(){
  const it = queue[qi]; if (!it) return;
  const t = au.currentTime;
  findServer(fails > 1).then(base => {
    if (fails >= 2) noHls.add(it.u);   // si la forma por pedacitos falló dos veces, se prueba la directa
    au.src = srcFor(base, it);
    au.addEventListener('loadedmetadata', function f(){ au.removeEventListener('loadedmetadata', f); if (t > 1) au.currentTime = t; }, {once: true});
    au.play().catch(()=>{});
  }).catch(()=>{});
}
au.addEventListener('error', () => { if (fails++ < 3) setTimeout(resume, 1500); else next(); });
let stuckTimer = null;
au.addEventListener('waiting', () => { clearTimeout(stuckTimer); stuckTimer = setTimeout(() => { if (!au.paused && au.readyState < 3 && fails++ < 3) resume(); }, au.currentTime < 1 ? 45000 : 15000); });
au.addEventListener('playing', () => { clearTimeout(stuckTimer); preNext(); });
// pedirle al servidor que baje desde ya la siguiente canción
let preDone = '';
function preNext(){
  if (upcomingFor !== qi) { upcoming = pickNext(); upcomingFor = qi; }
  const n = upcoming;
  if (n < 0 || !queue[n] || preDone === queue[n].u) return;
  if (queue[n].s > 900 || (queue[qi] && queue[qi].s > 900)) return;   // prédicas largas: no se bajan por adelantado
  preDone = queue[n].u;

}

// El iPhone pausa la música cuando llegan notificaciones (sonido, Siri, aviso de llamada). Si la pausa NO la

let quiero = false, reintentos = [];

function userPause(){ quiero = false; reintentos.forEach(clearTimeout); reintentos = []; au.pause(); }
function volverSola(){

// duración verdadera: el iPhone a veces calcula el doble; se usa la que dice YouTube si no cuadra
function realDur(){
  const it = queue[qi], d = isFinite(au.duration) ? au.duration : 0;
  if (it && it.s > 0 && (!d || d > it.s * 1.15 || d < it.s * 0.85)) return it.s;

}
let endGuard = '';
au.addEventListener('timeupdate', () => {
  const d = realDur(); if (!d) return;
  const p = Math.min(1, au.currentTime / d);
  $('fprog').value = Math.round(1000 * p); $('fprog').style.setProperty('--p', (p * 100) + '%');
  $('mline').firstElementChild.style.width = (p * 100) + '%';
  $('fcur').textContent = time(au.currentTime) || '0:00'; $('fdur').textContent = time(d);

  const it = queue[qi];

  estado = ok ? 'Al día · cada teléfono avisa cuando abre la app' : 'Sin internet: es la lista guardada';
  draw();
}
async function telMenu(cod, draw){
  const o = registro(), x = o[cod] || {}, off = bloqueados().includes(cod);
  const nm = x.apodo || x.n || x.m || 'Teléfono ' + cod;
  const ops = [];
  if (off) ops.push(['✓', 'Volver a activar', () => { setBloqueado(cod, false); draw(); toast(nm + ' se vuelve a activar'); }]);
  else ops.push(['⛔', 'Desactivar Hosanna Music aquí', () => {
    if (!confirm('¿Desactivar a ' + nm + '?\n\nHosanna Music dejará de funcionar ahí la próxima vez que la abra con internet. Después puedes volver a activarla aquí mismo.')) return;
    setBloqueado(cod, true); draw();
  }]);
  ops.push(['✏', 'Ponerle nombre', () => { const v = prompt('Nombre para este teléfono (ej. Damaris, TV de la sala):', x.apodo || x.n || ''); if (v === null) return; const r = registro(); (r[cod] = r[cod] || {w: 1}).apodo = v.trim(); setRegistro(r); draw(); }]);
  if (!off) ops.push(['🗑', 'Quitar de la lista', () => { const r = registro(); delete r[cod]; setRegistro(r); const q = quitados(); q[cod] = Date.now(); store.set('quitados', JSON.stringify(q)); draw(); }]);
  if (x.t !== 'iphone') ops.push(['🔑', 'Ver su código de activación', async () => alert(nm + '\n\nCódigo de activación: ' + await activacion(cod))]);
  sheet(nm, ops, cod + (x.m ? ' · ' + x.m : ''), null);
}

// llegó con el enlace del propietario (…/#dueno=CLAVE): se guarda y se borra del enlace
(async () => {
  const m = /[#&]dueno=([^&]+)/.exec(location.hash);
  if (m) { history.replaceState(null, '', location.pathname + location.search); if (!await hacerDueno(decodeURIComponent(m[1]))) toast('Esa no es la clave de propietario'); }
  else if (CLAVE && await sha(CLAVE) !== DUENO_H) { CLAVE = ''; store.set('dueno', ''); }
  if (esDueno()) { sincronizar().then(republicar); }
})();

mirarBloqueo();
if (!KEY) gate(); else { registrar(); revisar(); }
goTab('home');
