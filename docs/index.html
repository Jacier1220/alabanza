<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alabanza">
<meta name="theme-color" content="#1a120b">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<title>Alabanza</title>
<style>
:root{--bg:#1a120b;--card:#2a1d12;--gold:#e8b04b;--cream:#fff1dc;--dim:#bfa888;--line:#e8b04b44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:18px 16px 6px}
h1{margin:0;font-family:Georgia,serif;color:var(--gold);font-size:30px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
#q{width:calc(100% - 32px);margin:10px 16px 6px;padding:12px 18px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-size:16px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-size:14px}
.chip.on{background:var(--gold);color:#1a120b;border-color:var(--gold)}
.head{display:flex;align-items:center;gap:10px;padding:10px 16px 2px}
.back{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-size:18px}
.htitle{font-family:Georgia,serif;font-size:19px;font-weight:bold}
.btns{display:flex;gap:8px;padding:8px 16px}
.btn{padding:9px 16px;border-radius:20px;border:1px solid var(--line);background:#fff1dc22;color:var(--cream);font-weight:600;font-size:14px}
.btn.gold{background:var(--gold);color:#1a120b;border:0}
.sec{color:var(--gold);font-size:12px;letter-spacing:.18em;font-weight:700;padding:16px 16px 4px}
.row{display:flex;align-items:center;gap:12px;padding:7px 10px;margin:0 6px;border-radius:14px}
.row:active,.row.now{background:#e8b04b33}
.th{position:relative;flex:none;width:104px;height:58px;border-radius:10px;background:var(--card) center/cover}
.th.sq{width:58px}
.th.round{width:58px;border-radius:29px}
.badge{position:absolute;right:4px;bottom:4px;font-size:11px;font-weight:700;background:#1a120bcc;padding:1px 6px;border-radius:9px}
.tx{min-width:0;flex:1}
.t1{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t2{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.more{margin:2px 16px;padding:10px 14px;border-radius:12px;background:#fff1dc14;color:var(--gold);font-size:14px}
#msg{text-align:center;color:var(--dim);padding:40px 30px;font-size:15px;line-height:1.5}
#bar{position:fixed;left:0;right:0;bottom:0;background:#120c07f2;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#prog{width:100%;accent-color:var(--gold);margin:0 0 4px}
.pl{display:flex;align-items:center;gap:10px}
#cov{width:46px;height:46px;border-radius:8px;background:var(--card) center/cover;flex:none}
.pb{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--cream);font-size:22px}
.pb.big{background:var(--gold);color:#1a120b}
#bar .pl{cursor:pointer}
#full{position:fixed;inset:0;z-index:5;background:linear-gradient(#3a2814,var(--bg) 60%);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s ease;visibility:hidden}
#full.open{transform:none;visibility:visible}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.fhead .back{font-size:22px}
.fq{color:var(--dim);font-size:13px;text-align:center;flex:1;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fcov{width:min(82vw,360px);aspect-ratio:1;margin:22px auto 18px;border-radius:16px;background:var(--card) center/cover;box-shadow:0 14px 40px #0009}
.ft{font-size:20px;font-weight:700;padding:0 24px;line-height:1.25}
.fc{padding:8px 24px 0}
.chbtn{border:0;background:#fff1dc22;color:var(--cream);font-size:15px;font-weight:600;padding:8px 14px;border-radius:20px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chbtn span{color:var(--gold);font-weight:500}
#fprog{width:calc(100% - 48px);margin:16px 24px 0;accent-color:var(--gold)}
.ftime{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;padding:2px 24px 0}
.fbtns{display:flex;justify-content:space-around;align-items:center;padding:12px 18px 6px}
.fbig{width:68px;height:68px;border-radius:34px;font-size:30px}
.pb.on{color:var(--gold)}
#fshuf:not(.on),#frep:not(.on){opacity:.4}
.modes{display:flex;gap:6px;margin:10px 16px 0;background:var(--card);border-radius:22px;padding:4px;border:1px solid var(--line)}
.mode{flex:1;padding:9px;border:0;border-radius:18px;background:transparent;color:var(--cream);font-size:15px;font-weight:600}
.mode.on{background:var(--gold);color:#1a120b}
#gate{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:30px}
#gate input{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-size:20px;text-align:center;letter-spacing:.2em;margin:16px 0}
</style>
</head>
<body>
<header><h1>✝ Alabanza</h1><div class="sub" id="st">Música cristiana y prédicas · sin anuncios</div></header>
<div class="modes"><button class="mode on" id="mMus">🎵 Música</button><button class="mode" id="mPred">🎤 Prédicas</button></div>
<input id="q" type="search" placeholder="Buscar canción, artista o canal · o pegar enlace" enterkeyhint="search">
<div class="chips" id="chips"></div>
<div id="view"></div>
<div id="msg"></div>

<div id="bar">
  <input id="prog" type="range" min="0" max="1000" value="0">
  <div class="pl">
    <div id="cov"></div>
    <div class="tx"><div class="t1" id="nt" style="-webkit-line-clamp:1"></div><div class="t2" id="nc"></div></div>
    <button class="pb" id="bprev">⏮</button><button class="pb big" id="bplay">▶</button><button class="pb" id="bnext">⏭</button>
  </div>
</div>
<div id="full">
  <div class="fhead"><button class="back" id="fclose">⌄</button><div class="fq" id="fq">Reproduciendo</div><span style="width:40px"></span></div>
  <div id="fcov"></div>
  <div class="ft" id="ft"></div><div class="fc" id="fc"></div>
  <input id="fprog" type="range" min="0" max="1000" value="0">
  <div class="ftime"><span id="fcur">0:00</span><span id="fdur"></span></div>
  <div class="fbtns">
    <button class="pb" id="fshuf">🔀</button><button class="pb" id="fprev">⏮</button>
    <button class="pb big fbig" id="fplay">▶</button>
    <button class="pb" id="fnext">⏭</button><button class="pb" id="frep">🔁</button>
  </div>
  <div class="sec">A CONTINUACIÓN</div>
  <div id="flist"></div>
</div>
<audio id="au" preload="auto"></audio>

<div id="gate">
  <h1>✝ Alabanza</h1>
  <p class="sub" style="font-size:16px">Escribe la clave del servidor de la casa (sale en el teléfono servidor).</p>
  <input id="key" autocomplete="off" autocapitalize="none">
  <button class="btn gold" id="keyok" style="padding:14px;font-size:17px">Entrar</button>
</div>

<script>
const TOPIC = 'alabanza-yhepau56t8hn93x2';
const CHIPS = [['Alabanza','alabanza'],['Adoración','adoración'],['Marcos Witt','Marcos Witt'],['Jesús Adrián Romero','Jesús Adrián Romero'],
  ['Miel San Marcos','Miel San Marcos'],['Christine D\'Clario','Christine D\'Clario'],['Barak','Barak'],['Himnos','himnos cristianos']];
// modo prédicas: temas y pastores
const PCHIPS = [['Prédicas','prédica cristiana'],['Dante Gebel','Dante Gebel'],['Cash Luna','Cash Luna'],['Armando Alducin','Armando Alducin'],
  ['Sugel Michelén','Sugel Michelén'],['Miguel Núñez','Miguel Núñez'],['Juan Carlos Harrigan','Juan Carlos Harrigan'],['Yesenia Then','Yesenia Then'],
  ['Itiel Arroyo','Itiel Arroyo'],['Fe','fe'],['Familia','familia'],['Oración','oración'],['Esperanza','esperanza'],['Salvación','salvación']];
let mode = 'musica';
const $ = id => document.getElementById(id);
const store = { get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e) { return d; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} } };
let KEY = store.get('clave', ''), SRV = store.get('srv', '');
let queue = [], qi = -1, qname = '', shuffle = false, stack = [];

function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function time(s){ s = Math.floor(s||0); if (s<=0) return ''; const h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=String(s%60).padStart(2,'0'); return h ? h+':'+String(m).padStart(2,'0')+':'+x : m+':'+x; }
function msg(t){ $('msg').innerHTML = t ? esc(t).replace(/\n/g,'<br>') : ''; }

async function findServer(force){
  if (SRV && !force) return SRV;
  const r = await fetch('https://ntfy.sh/' + TOPIC + '/json?poll=1&since=24h');
  const lines = (await r.text()).trim().split('\n').filter(Boolean);
  for (let i = lines.length - 1; i >= 0; i--) {
    try { const o = JSON.parse(lines[i]); if (o.event === 'message' && /^https:\/\//.test(o.message)) { SRV = o.message.trim(); store.set('srv', SRV); return SRV; } } catch(e) {}
  }
  throw new Error('El servidor de la casa no aparece. ¿Está prendido y con internet?');
}

async function api(path, params){
  const qs = new URLSearchParams({...params, k: KEY}).toString();
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const base = await findServer(attempt > 0);
      const r = await fetch(base + path + '?' + qs);
      if (r.status === 403) { gate(); throw new Error('Clave equivocada'); }
      if (!r.ok) throw new Error('El servidor respondió ' + r.status);
      return await r.json();
    } catch (e) { if (attempt === 1 || e.message === 'Clave equivocada') throw e; }
  }
}

function rowHtml(it, i){
  const kind = it.k || 'song', list = it.list;
  const cls = kind === 'channel' ? 'round' : (list && kind !== 'mix') ? 'sq' : '';
  const label = kind === 'channel' ? '👤 Canal' : kind === 'album' ? '💿 Álbum' : kind === 'mix' ? '✨ Mix' : list ? '☰ Lista' : '🎵 Canción';
  const badge = list ? (it.n ? '☰ ' + it.n : '') : time(it.s);
  const now = !list && queue[qi] && queue[qi].u === it.u ? ' now' : '';
  return `<div class="row${now}" data-i="${i}"><div class="th ${cls}" style="background-image:url('${esc(it.th)}')">${badge ? `<span class="badge">${badge}</span>` : ''}</div>
    <div class="tx"><div class="t1">${esc(it.t)}</div><div class="t2">${label}${it.c ? ' · ' + esc(it.c) : ''}</div></div></div>`;
}

let rows = [];
function render(blocks, head){
  rows = [];
  let h = head || '';
  for (const b of blocks) {
    if (!b.items || !b.items.length) continue;
    if (b.title) h += `<div class="sec">${b.title}</div>`;
    const show = b.max ? b.items.slice(0, b.max) : b.items;
    for (const it of show) { h += rowHtml(it, rows.length); rows.push({it, from: b.items}); }
    if (b.max && b.items.length > b.max) { h += `<div class="more" data-more="${blocks.indexOf(b)}">Ver todos (${b.items.length}) ›</div>`; }
  }
  $('view').innerHTML = h;
  $('view').querySelectorAll('.row').forEach(el => el.onclick = () => tap(+el.dataset.i));
  $('view').querySelectorAll('.more').forEach(el => el.onclick = () => { const b = blocks[+el.dataset.more]; push(); render([{title: b.title, items: b.items}], backHead(b.title.replace(/^[^A-ZÁÉÍÓÚ]+/, ''))); scrollTo(0,0); });
  window._blocks = blocks;
}

function backHead(title, sub, songs, channel){
  const fb = channel ? `<div class="btns"><button class="btn" id="follow" onclick="toggleFollow()">${isFollowed(channel.u) ? '✓ Siguiendo' : '⭐ Seguir canal'}</button></div>` : '';
  return backHead0(title, sub, songs) + fb;
}
function backHead0(title, sub, songs){
  return `<div class="head"><button class="back" onclick="pop()">←</button><div><div class="htitle">${esc(title)}</div>${sub ? `<div class="t2">${esc(sub)}</div>` : ''}</div></div>`
    + (songs ? `<div class="btns"><button class="btn gold" onclick="playAll(false)">▶ Reproducir</button><button class="btn" onclick="playAll(true)">🔀 Aleatorio</button></div>` : '');
}
function push(){ stack.push($('view').innerHTML ? {html: $('view').innerHTML, rows, blocks: window._blocks, y: scrollY} : null); }
function pop(){ const s = stack.pop(); if (!s) return; render(s.blocks); $('view').innerHTML = s.html; $('view').querySelectorAll('.row').forEach(el => el.onclick = () => tap(+el.dataset.i)); rows = s.rows; scrollTo(0, s.y); }

// búsquedas guardadas en el iPhone: salen al instante y luego se actualizan
function cacheGet(k){ try { return JSON.parse(store.get('cache', '{}'))[k]; } catch(e) { return null; } }
function cachePut(k, v){
  try {
    const c = JSON.parse(store.get('cache', '{}')); c[k] = v;
    const keys = Object.keys(c); while (keys.length > 25) delete c[keys.shift()];
    store.set('cache', JSON.stringify(c));
  } catch(e) {}
}
let searchId = 0;
async function search(q){
  const my = ++searchId;
  stack = []; $('view').innerHTML = '';
  const pred = mode === 'pred', ck = (pred ? 'p|' : 'b|') + q;
  const old = cacheGet(ck);
  if (old) { showSearch(old); } else msg(pred ? 'Buscando prédicas…' : 'Buscando…');
  try {
    const r = await api('/api/buscar', pred ? {q, pred: 1} : {q});
    if (my !== searchId) return;
    cachePut(ck, r);
    if (!old || stack.length === 0 && scrollY < 50 && !document.querySelector('.row.now')) showSearch(r);
  } catch (e) { if (my === searchId && !old) msg(e.message); }
}
function showSearch(r){
    msg('');
    const songs = r.canciones || [];
    if (mode === 'pred') {
      render([{title:'🎤 PRÉDICAS', items: songs, max: 8}, {title:'👤 PASTORES Y CANALES', items: r.canales, max: 3}, {title:'☰ SERIES Y LISTAS DE PRÉDICAS', items: r.listas, max: 4}]);
      if (!songs.length && !(r.listas||[]).length && !(r.canales||[]).length) msg('No encontré prédicas con esa búsqueda.');
      return;
    }
    const mix = songs.length ? [{t: 'Mix de ' + songs[0].t, c: songs[0].c, th: songs[0].th, u: 'https://www.youtube.com/watch?v=' + vid(songs[0].u) + '&list=RD' + vid(songs[0].u), k: 'mix', list: true}] : [];
    render([{title:'🎵 CANCIONES', items: songs, max: 5}, {title:'👤 CANALES', items: r.canales, max: 2}, {title:'💿 ÁLBUMES', items: r.albumes, max: 3},
            {title:'✨ MIX', items: mix}, {title:'☰ LISTAS', items: r.listas, max: 3}]);
    if (!songs.length && !(r.albumes||[]).length && !(r.listas||[]).length && !(r.canales||[]).length) msg('No encontré música cristiana con esa búsqueda.');
}
function vid(u){ const m = /[?&]v=([^&]+)/.exec(u||''); return m ? m[1] : (u||'').split('/').pop(); }

async function openList(it){
  push(); scrollTo(0,0);
  $('view').innerHTML = backHead(it.t, (it.k === 'channel' ? 'Canal' : it.k === 'album' ? 'Álbum' : it.k === 'mix' ? 'Mix' : 'Lista') + (it.c ? ' · ' + it.c : ''));
  msg('Cargando…');
  try {
    if (it.k === 'channel') {
      const r = await api('/api/canal', {u: it.u});
      msg('');
      if (it.t === 'Canal' && r.videos && r.videos[0] && r.videos[0].c) it.t = r.videos[0].c;   // canal pegado: poner su nombre
      if (!it.th && r.videos && r.videos[0]) it.th = r.videos[0].th;
      window._channel = it;
      qname = it.t;
      render([{title:'☰ LISTAS DEL CANAL', items: r.listas}, {title:'🎵 VIDEOS RECIENTES', items: r.videos}], backHead(it.t, 'Canal' + (it.c ? ' · ' + it.c : ''), (r.videos||[]).length, it));
    } else {
      const r = await api('/api/lista', {u: it.u, mix: it.k === 'mix' ? 1 : 0});
      msg(r.length ? '' : 'Esta lista no tiene canciones.');
      qname = it.t;
      window._owner = it;
      const own = it.k !== 'mix' && it.c && it.c !== 'YouTube'
        ? `<div class="btns" style="padding-top:0"><button class="chbtn" onclick="ownerChannel()">👤 ${esc(it.c)} <span>› Ir al canal</span></button></div>` : '';
      render([{items: r}], backHead(it.t, (it.k === 'album' ? 'Álbum' : it.k === 'mix' ? 'Mix' : 'Lista') + ' · ' + r.length + ' canciones', r.length) + own);
    }
  } catch (e) { msg(e.message); }
}

function tap(i){
  const {it, from} = rows[i];
  if (it.list) { openList(it); return; }
  const songs = from.filter(x => !x.list);
  play(songs, songs.indexOf(it));
}
function playAll(sh){ const songs = rows.map(r => r.it).filter(x => !x.list); if (!songs.length) return; shuffle = sh; play(songs, sh ? Math.floor(Math.random()*songs.length) : 0); }

// ------------------------------------------------------------ reproductor (suena con la pantalla bloqueada)
const au = $('au');
let played = new Set(), fails = 0;
function play(list, i){ queue = list.slice(); played = new Set(); start(i); }
async function start(i){
  if (i < 0 || i >= queue.length) return;
  qi = i; played.add(i); fails = 0;
  const it = queue[i];
  $('bar').style.display = 'block';
  $('nt').textContent = it.t; $('nc').textContent = it.c || '';
  $('cov').style.backgroundImage = `url('${it.th}')`;
  try {
    const base = await findServer(false);
    au.src = base + '/audio?u=' + encodeURIComponent(it.u) + '&k=' + encodeURIComponent(KEY);
    await au.play();
  } catch (e) { /* iOS a veces pide tocar ▶ la primera vez */ }
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({title: it.t, artist: it.c || '', album: qname || 'Alabanza', artwork: [{src: it.th, sizes: '480x360', type: 'image/jpeg'}]});
  }
  document.querySelectorAll('.row').forEach(el => { const r = rows[+el.dataset.i]; el.classList.toggle('now', !!r && !r.it.list && r.it.u === it.u); });
  fullUpdate();
  addHistory(it);
}

// ------------------------------------------------------------ historial (se guarda en este iPhone, últimas 200)
function histList(){ try { return JSON.parse(store.get('historial', '[]')); } catch(e) { return []; } }
function addHistory(it){
  const l = histList().filter(h => h.u !== it.u);
  l.unshift({t: it.t, c: it.c || '', cu: it.cu || '', u: it.u, th: it.th || '', s: it.s || 0, cuando: Date.now()});
  store.set('historial', JSON.stringify(l.slice(0, 200)));
}
function ago(ms){
  const d = new Date(ms), hoy = new Date(); hoy.setHours(0,0,0,0);
  if (d >= hoy) return 'HOY';
  if (d >= hoy - 86400000) return 'AYER';
  if (d >= hoy - 6 * 86400000) return 'ESTA SEMANA';
  return 'ANTES';
}
function showHistory(){
  stack = []; scrollTo(0,0);
  const l = histList();
  msg(l.length ? '' : 'Todavía no has escuchado nada.\nLo que reproduzcas va a aparecer aquí.');
  const groups = [];
  for (const h of l) { const g = ago(h.cuando); let b = groups.find(x => x.title === '🕘 ' + g); if (!b) groups.push(b = {title: '🕘 ' + g, items: []}); b.items.push(h); }
  const head = l.length ? `<div class="btns"><button class="btn gold" onclick="playAll(false)">▶ Reproducir todo</button><button class="btn" onclick="clearHistory()">🗑 Borrar</button></div>` : '';
  qname = 'Historial';
  render(groups, head);
}
function clearHistory(){ if (confirm('¿Borrar todo el historial?')) { store.set('historial', '[]'); showHistory(); } }

// ------------------------------------------------------------ reproductor grande (sube desde la barra)
let repeat = 0;   // 0 no, 1 toda la lista, 2 una canción
function hq(th){ return (th || '').replace(/\/(hq|mq|sd)?default\.jpg/, '/hqdefault.jpg'); }
function fullUpdate(){
  const it = queue[qi]; if (!it) return;
  $('ft').textContent = it.t;
  $('fc').innerHTML = it.c ? `<button class="chbtn" onclick="goChannel()">👤 ${esc(it.c)} <span>› Ir al canal</span></button>` : '';
  $('fq').textContent = qname ? 'Reproduciendo de: ' + qname : 'Reproduciendo';
  $('fcov').style.backgroundImage = `url('${hq(it.th)}')`;
  $('fshuf').classList.toggle('on', shuffle);
  $('frep').classList.toggle('on', repeat > 0); $('frep').textContent = repeat === 2 ? '🔂' : '🔁';
  const order = [];
  for (let k = qi + 1; k < queue.length && order.length < 40; k++) order.push(k);
  if (repeat === 1) for (let k = 0; k < qi && order.length < 40; k++) order.push(k);
  $('flist').innerHTML = order.length ? order.map(k => { const s = queue[k];
    return `<div class="row" data-q="${k}"><div class="th" style="background-image:url('${esc(s.th)}')">${time(s.s) ? `<span class="badge">${time(s.s)}</span>` : ''}</div><div class="tx"><div class="t1">${esc(s.t)}</div><div class="t2">${esc(s.c || '')}</div></div></div>`; }).join('')
    : `<div class="t2" style="padding:6px 16px">${shuffle ? 'En aleatorio: la siguiente se elige al azar.' : 'No hay más canciones en la lista.'}</div>`;
  $('flist').querySelectorAll('.row').forEach(el => el.onclick = () => start(+el.dataset.q));
}
// como en YouTube: tocar el canal de lo que suena abre ese canal
function ownerChannel(){ const l = window._owner; if (l) channelOf(l.c, l.cu); }
async function goChannel(){
  const it = queue[qi]; if (!it || !it.c) return;
  closeFull();
  channelOf(it.c, it.cu);
}
async function channelOf(name, cu){
  const it = {c: name, cu};
  if (it.cu) { openList({t: it.c, u: it.cu, k: 'channel', list: true, c: ''}); return; }
  msg('Buscando el canal ' + it.c + '…');
  try {
    const r = await api('/api/buscar', {q: it.c});
    const l = r.canales || [], n = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
    const ch = l.find(c => n(c.t) === n(it.c)) || l[0];
    msg('');
    if (ch) openList(ch); else msg('No encontré el canal.');
  } catch (e) { msg(e.message); }
}
function openFull(){ fullUpdate(); $('full').classList.add('open'); $('full').scrollTop = 0; }
function closeFull(){ $('full').classList.remove('open'); }
$('bar').querySelector('.pl').addEventListener('click', e => { if (!e.target.closest('button')) openFull(); });
$('fclose').onclick = closeFull;
let ty = null;   // deslizar hacia abajo para bajarlo
$('full').addEventListener('touchstart', e => { ty = $('full').scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
$('full').addEventListener('touchend', e => { if (ty !== null && e.changedTouches[0].clientY - ty > 110) closeFull(); ty = null; });
$('fplay').onclick = () => au.paused ? au.play() : au.pause();
$('fnext').onclick = () => next(); $('fprev').onclick = () => prev();
$('fshuf').onclick = () => { shuffle = !shuffle; played = new Set([qi]); fullUpdate(); };
$('frep').onclick = () => { repeat = (repeat + 1) % 3; fullUpdate(); };
$('fprog').oninput = () => { const d = realDur(); if (d) au.currentTime = d * $('fprog').value / 1000; };
function nextIndex(){
  if (shuffle && queue.length > 1) {
    let left = queue.map((_, k) => k).filter(k => k !== qi && !played.has(k));
    if (!left.length) { played = new Set([qi]); left = queue.map((_, k) => k).filter(k => k !== qi); }
    return left[Math.floor(Math.random()*left.length)];
  }
  return qi + 1 < queue.length ? qi + 1 : (repeat === 1 && queue.length ? 0 : -1);
}
function next(){ const n = nextIndex(); if (n >= 0) start(n); }
function ended(){ if (repeat === 2) { au.currentTime = 0; au.play().catch(()=>{}); } else next(); }
function prev(){ if (au.currentTime > 5) au.currentTime = 0; else if (qi > 0) start(qi - 1); }
au.addEventListener('ended', ended);
// si se traba: volver a pedir desde el mismo segundo (hasta 3 veces), luego pasar a la siguiente
function resume(){
  const it = queue[qi]; if (!it) return;
  const t = au.currentTime;
  findServer(fails > 1).then(base => {
    au.src = base + '/audio?u=' + encodeURIComponent(it.u) + '&k=' + encodeURIComponent(KEY);
    au.addEventListener('loadedmetadata', function f(){ au.removeEventListener('loadedmetadata', f); if (t > 1) au.currentTime = t; }, {once: true});
    au.play().catch(()=>{});
  }).catch(()=>{});
}
au.addEventListener('error', () => { if (fails++ < 3) setTimeout(resume, 1500); else next(); });
let stuckTimer = null;
au.addEventListener('waiting', () => { clearTimeout(stuckTimer); stuckTimer = setTimeout(() => { if (!au.paused && au.readyState < 3 && fails++ < 3) resume(); }, au.currentTime < 1 ? 45000 : 15000); });
au.addEventListener('playing', () => { clearTimeout(stuckTimer); preNext(); });
// pedirle al servidor que baje desde ya la siguiente canción
let preDone = '';
function preNext(){
  const n = shuffle ? -1 : (qi + 1 < queue.length ? qi + 1 : -1);
  if (n < 0 || !queue[n] || preDone === queue[n].u) return;
  preDone = queue[n].u;
  api('/api/pre', {u: queue[n].u}).catch(()=>{});
}
au.addEventListener('play', () => { $('bplay').textContent = '⏸'; $('fplay').textContent = '⏸'; });
au.addEventListener('pause', () => { $('bplay').textContent = '▶'; $('fplay').textContent = '▶'; });
// duración verdadera: el iPhone a veces calcula el doble; se usa la que dice YouTube si no cuadra
function realDur(){
  const it = queue[qi], d = isFinite(au.duration) ? au.duration : 0;
  if (it && it.s > 0 && (!d || d > it.s * 1.15 || d < it.s * 0.85)) return it.s;
  return d;
}
let endGuard = '';
au.addEventListener('timeupdate', () => {
  const d = realDur(); if (!d) return;
  const v = Math.round(1000 * Math.min(1, au.currentTime / d));
  $('prog').value = v; $('fprog').value = v;
  $('fcur').textContent = time(au.currentTime) || '0:00'; $('fdur').textContent = time(d);
  // si la canción ya llegó a su final real pero el iPhone cree que sigue, pasar a la siguiente
  const it = queue[qi];
  if (it && isFinite(au.duration) && au.duration > d + 5 && au.currentTime >= d - 0.4 && endGuard !== it.u + qi) { endGuard = it.u + qi; ended(); }
});
$('prog').oninput = () => { const d = realDur(); if (d) au.currentTime = d * $('prog').value / 1000; };
$('bplay').onclick = () => au.paused ? au.play() : au.pause();
$('bnext').onclick = next; $('bprev').onclick = prev;
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => au.play());
  navigator.mediaSession.setActionHandler('pause', () => au.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('previoustrack', prev);
  try { navigator.mediaSession.setActionHandler('seekto', d => { au.currentTime = d.seekTime; }); } catch(e) {}
}

// ------------------------------------------------------------ inicio
function gate(){ $('gate').style.display = 'flex'; $('key').value = KEY; }
$('keyok').onclick = () => { KEY = $('key').value.trim(); store.set('clave', KEY); $('gate').style.display = 'none'; search(CHIPS[0][1]); };
// ------------------------------------------------------------ canales que sigues (se guardan en este iPhone)
function follows(){ try { return JSON.parse(store.get('canales', '[]')); } catch(e) { return []; } }
function isFollowed(u){ return follows().some(c => c.u === u); }
function toggleFollow(){
  const ch = window._channel; if (!ch) return;
  let l = follows().filter(c => c.u !== ch.u);
  if (!isFollowed(ch.u)) l.unshift({t: ch.t, c: ch.c || '', u: ch.u, th: ch.th || '', k: 'channel', list: true});
  store.set('canales', JSON.stringify(l));
  const b = $('follow'); if (b) b.textContent = isFollowed(ch.u) ? '✓ Siguiendo' : '⭐ Seguir canal';
}
function showFollowed(){
  stack = []; scrollTo(0,0);
  const l = follows();
  msg(l.length ? '' : 'Todavía no sigues canales.\nBusca el nombre del canal, tócalo en la sección 👤 CANALES y toca "⭐ Seguir canal".');
  render([{title: '👤 CANALES QUE SIGUES', items: l}]);
}

// ------------------------------------------------------------ pegar un enlace de YouTube (video, lista, mix o canal)
function isUrl(v){ return /^(https?:\/\/)?([a-z0-9-]+\.)*(youtube\.com|youtu\.be|spotify\.com|deezer\.com)\//i.test(v.trim()); }
async function openUrl(v){
  let u = v.trim(); if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  if (/spotify\.com|deezer\.com/i.test(u)) { msg('Por ahora la página solo abre enlaces de YouTube.\nLos de Spotify se pasan con la app del teléfono.'); return; }
  stack = []; $('view').innerHTML = ''; msg('');
  const list = /[?&]list=([^&#]+)/.exec(u), id = /(?:[?&]v=|youtu\.be\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/.exec(u);
  if (list) { const mix = list[1].startsWith('RD'); openList({t: mix ? 'Mix pegado' : 'Lista pegada', u, k: mix ? 'mix' : 'list', list: true}); return; }
  if (/youtube\.com\/(@|channel\/|c\/|user\/)/i.test(u)) { openList({t: 'Canal', u: u.split('?')[0], k: 'channel', list: true}); return; }
  if (!id) { msg('Ese enlace no lo entiendo. Pega un enlace de un video, lista o canal de YouTube.'); return; }
  const it = {t: 'Video pegado', c: '', u: 'https://www.youtube.com/watch?v=' + id[1], th: 'https://i.ytimg.com/vi/' + id[1] + '/hqdefault.jpg'};
  try { const o = await (await fetch('https://noembed.com/embed?url=' + encodeURIComponent(it.u))).json(); if (o.title) { it.t = o.title; it.c = o.author_name || ''; } } catch(e) {}
  qname = 'Enlace';
  render([{title: '🔗 ENLACE PEGADO', items: [it]}]);
  play([it], 0);
}
async function pasteLink(){
  let v = '';
  try { v = (await navigator.clipboard.readText()) || ''; } catch(e) {}
  if (!isUrl(v)) v = prompt('Pega aquí el enlace de YouTube (video, lista o canal):', v) || '';
  if (v.trim()) { $('q').value = v.trim(); openUrl(v); }
}
function chipsOff(){ document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); }
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const v = $('q').value.trim(); if (v) { chipsOff(); isUrl(v) ? openUrl(v) : search(v); $('q').blur(); } } });
$('q').addEventListener('paste', () => setTimeout(() => { const v = $('q').value.trim(); if (isUrl(v)) { chipsOff(); openUrl(v); $('q').blur(); } }, 50));
function drawChips(){
  const list = mode === 'pred' ? PCHIPS : CHIPS;
  $('chips').innerHTML = `<button class="chip" id="paste">🔗 Pegar enlace</button><button class="chip" id="mine">⭐ Mis canales</button><button class="chip" id="hist">🕘 Historial</button>`
    + list.map((c, i) => `<button class="chip${i===0?' on':''}" data-i="${i}">${esc(c[0])}</button>`).join('');
  $('paste').onclick = () => { chipsOff(); pasteLink(); };
  $('mine').onclick = () => { chipsOff(); $('mine').classList.add('on'); showFollowed(); };
  $('hist').onclick = () => { chipsOff(); $('hist').classList.add('on'); showHistory(); };
  $('chips').querySelectorAll('.chip[data-i]').forEach(el => el.onclick = () => { chipsOff(); el.classList.add('on'); $('q').value = ''; search(list[+el.dataset.i][1]); });
  $('q').placeholder = mode === 'pred' ? 'Buscar prédica o nombre del pastor…' : 'Buscar canción, artista o canal · o pegar enlace';
}
function setMode(m){
  mode = m;
  $('mMus').classList.toggle('on', m === 'musica'); $('mPred').classList.toggle('on', m === 'pred');
  drawChips(); $('q').value = '';
  search((m === 'pred' ? PCHIPS : CHIPS)[0][1]);
}
$('mMus').onclick = () => setMode('musica');
$('mPred').onclick = () => setMode('pred');
drawChips();
if (!KEY) gate(); else search(CHIPS[0][1]);
</script>
